services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lotwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lotwise_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lotwise}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lotwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lotwise_pgdata:
